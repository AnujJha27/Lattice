name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run browser-independent regression checks
        run: |
          node test/portraitAccessibility.test.js
          node test/portraitHistory.test.js
          node test/portraitLayout.test.js
          node test/reviewSession.test.js
          node test/brainPrompt.test.js
          brain_check_dir="$(mktemp -d)"
          node_modules/.bin/tsc --target ES2022 --module commonjs --moduleResolution node --skipLibCheck --esModuleInterop --outDir "$brain_check_dir" lib/brainGraph.ts test/brainGraph.test.ts
          NODE_PATH="$(pwd)/node_modules" node "$brain_check_dir/test/brainGraph.test.js"
      - run: npm run build
      - name: Install Chromium for portrait browser checks
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Run portrait browser contract checks
        run: npm run e2e

  api:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lattice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/lattice_test
      SUPABASE_JWT_SECRET: test-secret-do-not-use
      SUPABASE_URL: https://test.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Prepare Supabase auth stub
        env:
          PGPASSWORD: test
        run: >-
          psql --host=localhost --username=postgres --dbname=lattice_test
          --set=ON_ERROR_STOP=1
          --command 'CREATE SCHEMA auth; CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$; CREATE TABLE auth.users (id uuid PRIMARY KEY);'
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: pytest -q

  migration-check:
    name: Alembic migration sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: apps/api
        run: pip install -e .
      - name: Verify migrations apply offline (SQL generation)
        working-directory: apps/api
        run: |
          migration_sql="$RUNNER_TEMP/lattice-alembic.sql"
          alembic upgrade head --sql > "$migration_sql"
          test -s "$migration_sql"
